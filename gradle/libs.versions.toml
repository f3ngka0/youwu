[versions]
agp = "8.13.2"
kotlin = "2.4.10"
coreKtx = "1.16.0"
lifecycle = "2.9.1"
activityCompose = "1.13.0"
composeBom = "2025.12.01"
navigationCompose = "2.9.8"
datastore = "1.2.1"
workManager = "2.11.2"
backdrop = "1.0.6"
kyantShapes = "1.2.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.11.0"
materialIconsExtended = "1.7.8"
zxingEmbedded = "4.3.0"
junit = "4.13.2"
